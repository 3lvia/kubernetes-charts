suite: test secret
templates:
  - secret.yaml
tests:
  - it: secret snapshot should match
    set:
      name: demo-job
      namespace: core
      environment: dev
      secret:
        dev:
          api_key: '__API_KEY_TO_BE_REPLACED_DEV__'
    asserts:
      - isKind:
          of: Secret
      - matchSnapshot: {}

  - it: is not rendered when .Values.secret is not set
    set:
      name: demo-job
      namespace: core
      environment: dev
    asserts:
      - hasDocuments:
          count: 0
