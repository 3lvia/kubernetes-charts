suite: test deployment
templates:
  - deployment.yaml
tests:
  - it: deployment snapshot should match
    set:
      image.tag: latest
      name: demo-api
      namespace: core
      microserviceType: webapi
      environment: dev
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 400m
          memory: 500Mi
    asserts:
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
      - matchSnapshot: {}

  - it: image is pinned by digest when image.digest is set
    set:
      image.tag: 1.2.3
      image.digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      name: demo-api
      namespace: core
      microserviceType: webapi
      environment: dev
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: containerregistryelvia.azurecr.io/core/demo-api:1.2.3@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  - it: image is pinned by environment-specific digest when image.<env>.digest is set
    set:
      image.test.tag: test
      image.test.digest: sha256:fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      name: demo-api
      namespace: core
      microserviceType: webapi
      environment: test
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: containerregistryelvia.azurecr.io/core/demo-api:test@sha256:fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210

  - it: image is not pinned when image.digest is unset
    set:
      image.tag: 1.2.3
      name: demo-api
      namespace: core
      microserviceType: webapi
      environment: dev
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: containerregistryelvia.azurecr.io/core/demo-api:1.2.3

  - it: deployment snapshot should match for dev-specific image when environment is dev
    set:
      image.dev.tag: dev
      name: demo-api
      namespace: core
      microserviceType: webapi
      environment: dev
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 400m
          memory: 500Mi
    asserts:
      - matchSnapshot: {}

  - it: deployment snapshot should match for test-specific image when environment is test
    set:
      image.test.tag: test
      name: demo-api
      namespace: core
      microserviceType: webapi
      environment: test
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 400m
          memory: 500Mi
    asserts:
      - matchSnapshot: {}

  - it: deployment snapshot should match for prod-specific image when environment is prod
    set:
      image.prod.tag: prod
      name: demo-api
      namespace: core
      microserviceType: webapi
      environment: prod
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 400m
          memory: 500Mi
    asserts:
      - matchSnapshot: {}

  - it: deployment snapshot should match for dev-specific image when environment isn't dev
    set:
      image.tag: latest
      image.dev.tag: dev
      name: demo-api
      namespace: core
      microserviceType: webapi
      environment: prod
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 400m
          memory: 500Mi
    asserts:
      - matchSnapshot: {}

  - it: deployment snapshot should match for multiple images
    set:
      image.tag: latest
      image.sandbox.tag: sandbox
      image.dev.tag: dev
      image.test.tag: test
      image.prod.tag: prod
      name: demo-api
      namespace: core
      microserviceType: webapi
      environment: test
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 400m
          memory: 500Mi
    asserts:
      - matchSnapshot: {}

  - it: applies restricted settings to sidecars
    set: &restrictedValues
      image.tag: latest
      name: demo-api
      namespace: core
      microserviceType: webapi
      environment: dev
      replicaCount: 1
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
      sidecars:
        - name: helper
          image:
            repository: example/helper
            tag: latest
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[1].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true

  - it: defaults seccomp without changing custom user and group settings
    set:
      <<: *restrictedValues
      securityContext:
        runAsUser: 2000
        fsGroup: 3000
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsUser: 2000
            fsGroup: 3000
            seccompProfile:
              type: RuntimeDefault

  - it: preserves an explicit localhost seccomp profile
    set:
      <<: *restrictedValues
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/custom.json
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            seccompProfile:
              type: Localhost
              localhostProfile: profiles/custom.json
