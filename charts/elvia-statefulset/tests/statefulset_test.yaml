suite: test statefulset pod security
templates:
  - statefulset.yaml
tests:
  - it: uses restricted-compatible security settings
    set:
      name: demo-worker
      namespace: core
      microserviceType: worker
      environment: dev
      replicaCount: 1
      image.tag: latest
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
    asserts:
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1001
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true